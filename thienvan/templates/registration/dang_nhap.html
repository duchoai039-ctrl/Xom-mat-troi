{% extends "thienvan/base.html" %}
{% block tieu_de %}Đăng nhập | Xóm Mặt Trời{% endblock %}
{% block noi_dung %}
<div class="container pt-5">
  <div class="khung-form mx-auto">
    <h1 class="mb-3">Về xóm thôi</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="nut">Đăng nhập</button>
    </form>
    <p class="mt-3 mb-0">Chưa có tài khoản? <a href="{% url 'dang_ky' %}">Đăng ký</a></p>
  </div>
</div>
{% endblock %}
