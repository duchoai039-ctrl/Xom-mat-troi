{% extends "thienvan/base.html" %}
{% block tieu_de %}Đăng ký | Xóm Mặt Trời{% endblock %}
{% block noi_dung %}
<div class="container pt-5">
  <div class="khung-form mx-auto">
    <h1 class="mb-3">Nhập hộ khẩu xóm Mặt Trời</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="nut">Đăng ký</button>
    </form>
    <p class="mt-3 mb-0">Đã có tài khoản? <a href="{% url 'dang_nhap' %}">Đăng nhập</a></p>
  </div>
</div>
{% endblock %}
